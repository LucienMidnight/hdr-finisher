name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            codebase/requirements.txt
            codebase/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: codebase/desktop/package-lock.json

      - name: Install dependencies
        working-directory: codebase
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix desktop

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: codebase
        shell: pwsh
        run: |
          $backendVersion = (python -c "import sys; sys.path.insert(0, 'backend'); from hdr_finisher.config import APP_VERSION; print(APP_VERSION)").Trim()
          $desktopVersion = (node -p "require('./desktop/package.json').version").Trim()
          $expectedTag = "v$backendVersion"
          if ($backendVersion -ne $desktopVersion) {
              throw "Backend version $backendVersion does not match desktop version $desktopVersion."
          }
          if ($expectedTag -ne "${{ github.ref_name }}") {
              throw "Release tag ${{ github.ref_name }} does not match application version $expectedTag."
          }

      - name: Run deterministic tests
        working-directory: codebase
        shell: pwsh
        run: |
          python -m pytest -q tests
          npm --prefix desktop test

      - name: Build Windows installers
        working-directory: codebase
        shell: pwsh
        run: |
          $env:HDR_FINISHER_PYTHON = (Get-Command python -ErrorAction Stop).Source
          .\tools\build_desktop.ps1

      - name: Smoke-test packaged Windows app
        working-directory: codebase
        shell: pwsh
        run: npm --prefix desktop run test:packaged

      - name: Write Windows checksums
        working-directory: codebase
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist-electron -File -Filter "HDR-Finisher-*.exe"
          if ($assets.Count -lt 2) {
              throw "Expected both Windows Setup and Portable executables."
          }
          $lines = foreach ($asset in $assets) {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant()
              "$hash  $($asset.Name)"
          }
          $lines | Set-Content -LiteralPath dist-electron\SHA256SUMS-Windows.txt -Encoding ascii

      - name: Upload Windows release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            codebase/dist-electron/HDR-Finisher-Setup-*-x64.exe
            codebase/dist-electron/HDR-Finisher-Portable-*-x64.exe
            codebase/dist-electron/SHA256SUMS-Windows.txt
          if-no-files-found: error

  build-macos:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            codebase/requirements.txt
            codebase/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: codebase/desktop/package-lock.json

      - name: Install dependencies
        working-directory: codebase
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix desktop

      - name: Verify Apple Silicon runner and release version
        working-directory: codebase
        run: |
          test "$(uname -m)" = "arm64"
          backend_version="$(python -c "import sys; sys.path.insert(0, 'backend'); from hdr_finisher.config import APP_VERSION; print(APP_VERSION)")"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          test "$backend_version" = "$desktop_version"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "v$backend_version" = "${GITHUB_REF_NAME}"
          fi

      - name: Build Apple Silicon package
        working-directory: codebase
        run: HDR_FINISHER_PYTHON="$(command -v python)" ./tools/build_desktop_macos.sh

      - name: Run deterministic tests
        working-directory: codebase
        run: |
          python -m pytest -q tests
          npm --prefix desktop test

      - name: Smoke-test packaged macOS app
        working-directory: codebase
        run: npm --prefix desktop run test:packaged

      - name: Verify macOS artifacts
        working-directory: codebase
        run: |
          codesign --verify --deep --strict --verbose=2 "dist-electron/mac-arm64/HDR Finisher.app"
          hdiutil verify dist-electron/HDR-Finisher-*-macOS-arm64.dmg
          unzip -tq dist-electron/HDR-Finisher-*-macOS-arm64.zip
          (cd dist-electron && shasum -a 256 -c SHA256SUMS-macOS.txt)

      - name: Upload macOS release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            codebase/dist-electron/HDR-Finisher-*-macOS-arm64.dmg
            codebase/dist-electron/HDR-Finisher-*-macOS-arm64.zip
            codebase/dist-electron/SHA256SUMS-macOS.txt
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            codebase/requirements.txt
            codebase/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: codebase/desktop/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config file xvfb libgtk-3-0 libnss3 libxss1 libasound2 libgbm1
          python -m pip install --upgrade pip
          python -m pip install -r codebase/requirements-dev.txt
          npm ci --prefix codebase/desktop

      - name: Verify release version
        working-directory: codebase
        run: |
          backend_version="$(python -c "import sys; sys.path.insert(0, 'backend'); from hdr_finisher.config import APP_VERSION; print(APP_VERSION)")"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          test "$backend_version" = "$desktop_version"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then test "v$backend_version" = "${GITHUB_REF_NAME}"; fi

      - name: Build pinned Linux encoders
        working-directory: codebase
        # The application suite below exercises the resulting binaries. Skip the
        # upstream projects' own test suites here because those can depend on the
        # runner's ImageMagick build and are outside our release qualification.
        run: ./tools/build_native_linux.sh --skip-tests

      - name: Run deterministic Linux tests
        working-directory: codebase
        run: |
          python -m pytest -q tests
          npm --prefix desktop test

      - name: Build Debian package on conservative glibc baseline
        working-directory: codebase
        run: HDR_FINISHER_PYTHON="$(command -v python)" ./tools/build_desktop_linux.sh --skip-native-tools

      - name: Smoke-test packaged app with GPU disabled
        working-directory: codebase
        run: HDR_FINISHER_TEST_OZONE_PLATFORM=x11 xvfb-run -a npm --prefix desktop run test:packaged

      - name: Verify package contents and every ELF
        working-directory: codebase
        run: |
          package_version="$(node -p "require('./desktop/package.json').version")"
          ./tools/verify_linux_package.sh "dist-electron/HDR-Finisher-${package_version}-Linux-x86_64.deb"
          (cd dist-electron && sha256sum -c SHA256SUMS-Linux.txt)

      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: |
            codebase/dist-electron/HDR-Finisher-*-Linux-x86_64.deb
            codebase/dist-electron/SHA256SUMS-Linux.txt
          if-no-files-found: error

  build-flatpak:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-util desktop-file-utils libxml2-utils xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08 org.freedesktop.Sdk.Extension.node24//25.08

      - name: Validate Flatpak metadata
        working-directory: packaging/flatpak
        run: |
          appstreamcli validate --no-net io.github.LucienMidnight.hdr-finisher.metainfo.xml
          desktop-file-validate io.github.LucienMidnight.hdr-finisher.desktop
          xmllint --noout io.github.LucienMidnight.hdr-finisher.xml
          flatpak-builder --show-manifest io.github.LucienMidnight.hdr-finisher.yml >/dev/null

      - name: Build offline-source Flatpak
        working-directory: packaging/flatpak
        run: |
          package_version="$(node -p "require('../../codebase/desktop/package.json').version")"
          flatpak-builder --user --force-clean --repo=repo build-dir io.github.LucienMidnight.hdr-finisher.yml
          flatpak build-bundle repo "HDR-Finisher-${package_version}-Linux-x86_64.flatpak" io.github.LucienMidnight.hdr-finisher stable
          sha256sum "HDR-Finisher-${package_version}-Linux-x86_64.flatpak" > SHA256SUMS-Flatpak.txt

      - name: Install and smoke-test Flatpak sidecar
        working-directory: packaging/flatpak
        run: |
          package_version="$(node -p "require('../../codebase/desktop/package.json').version")"
          flatpak install --user -y "HDR-Finisher-${package_version}-Linux-x86_64.flatpak"
          sidecar="/app/hdr-finisher/resources/backend/HDR Finisher Backend"
          flatpak run --user --env=HDR_FINISHER_DESKTOP_SECRET=ci --env=HDR_FINISHER_DESKTOP_CONTROL_SECRET=ci --command="$sidecar" io.github.LucienMidnight.hdr-finisher --desktop-sidecar --parent-pid 999999999 | grep "\"backend_version\":\"${package_version}\""
          set +e
          timeout 20 dbus-run-session -- xvfb-run -a flatpak run --user io.github.LucienMidnight.hdr-finisher --disable-gpu
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124

      - name: Upload Flatpak release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-flatpak-x64
          path: |
            packaging/flatpak/HDR-Finisher-*-Linux-x86_64.flatpak
            packaging/flatpak/SHA256SUMS-Flatpak.txt
            packaging/flatpak/io.github.LucienMidnight.hdr-finisher.yml
            packaging/flatpak/io.github.LucienMidnight.hdr-finisher.metainfo.xml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-macos
      - build-linux
      - build-flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Download verified release candidates
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "HDR Finisher $tag" \
              --latest \
              --notes-file RELEASE_NOTES.md
          fi
