[pytest]
testpaths = tests
# Print every thread's stack if one test runs over 10 minutes (CI hang diagnosis).
faulthandler_timeout = 600

markers:
    serial: resource-sensitive process startup/deadline checks; run after the parallel phase
    slow: at least one parametrized case measured over five seconds on the Windows PC
    gpu: requires a real GPU (CPU simulations of GPU protocols do not qualify)
    needs_test_photos: requires specific photographic fixture assets (bundled or external) or a local corpus
    windows_only: requires Windows platform semantics
    mac_only: requires macOS platform semantics
    posix_only: requires POSIX process semantics
    needs_native_helper: checks require an optional native binary, codec, filter or model
