<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HDR Finisher browser foundation</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <dialog id="directory-browser" class="directory-browser" aria-labelledby="directory-browser-title">
    <div class="directory-browser-header">
      <div>
        <h2 id="directory-browser-title">Choose a source image</h2>
      </div>
      <button id="directory-browser-close" class="text-button" type="button" aria-label="Close folder browser">Close</button>
    </div>
    <div class="directory-browser-path-row">
      <input id="directory-browser-path" type="text" aria-label="Current folder path" autocomplete="off" spellcheck="false">
      <button id="directory-browser-go" class="button-secondary" type="button">Go</button>
      <button id="directory-browser-up" class="button-secondary" type="button">Up</button>
      <button id="directory-browser-pin" class="button-secondary" type="button">Pin folder</button>
    </div>
    <div id="directory-browser-status" class="directory-browser-status" aria-live="polite">Loading folders…</div>
    <div class="media-browser-layout">
      <nav class="media-browser-sidebar" aria-label="Recent, pinned, and system locations">
        <strong>Recent</strong><ul id="directory-browser-recents"></ul>
        <strong>Pinned</strong><ul id="directory-browser-pinned"></ul>
        <strong>Locations</strong><ul id="directory-browser-locations"></ul>
      </nav>
      <div class="media-browser-table">
        <div class="media-browser-list-header" role="row">
          <span role="columnheader" aria-sort="ascending">
            <button type="button" data-media-browser-sort="name">Name</button>
            <span class="media-browser-column-resizer" role="separator" aria-orientation="vertical" aria-label="Resize Name column" tabindex="0" data-media-browser-resize="name"></span>
          </span>
          <span role="columnheader" aria-sort="none">
            <button type="button" data-media-browser-sort="size">Size</button>
            <span class="media-browser-column-resizer" role="separator" aria-orientation="vertical" aria-label="Resize Size column" tabindex="0" data-media-browser-resize="size"></span>
          </span>
          <span role="columnheader" aria-sort="none">
            <button type="button" data-media-browser-sort="kind">Kind</button>
            <span class="media-browser-column-resizer" role="separator" aria-orientation="vertical" aria-label="Resize Kind column" tabindex="0" data-media-browser-resize="kind"></span>
          </span>
          <span role="columnheader" aria-sort="none">
            <button type="button" data-media-browser-sort="date">Date Added</button>
            <span class="media-browser-column-resizer" role="separator" aria-orientation="vertical" aria-label="Resize Date Added column" tabindex="0" data-media-browser-resize="date"></span>
          </span>
        </div>
        <ul id="directory-browser-list" class="directory-browser-list" aria-label="Folders and supported images"></ul>
      </div>
      <div class="media-browser-preview-resizer" role="separator" aria-orientation="vertical" aria-label="Resize preview panel" tabindex="0"></div>
      <aside class="media-browser-preview" aria-label="Selected image preview">
        <div class="media-browser-preview-image-frame">
          <img id="directory-browser-preview" alt="" hidden>
        </div>
        <strong id="directory-browser-selection">No image selected</strong>
        <span id="directory-browser-preview-note" role="status" aria-live="polite">Select a supported image to preview it.</span>
      </aside>
    </div>
    <div class="directory-browser-actions">
      <label id="directory-browser-filename-row" class="directory-browser-filename" hidden>File name
        <input id="directory-browser-filename" type="text" autocomplete="off" spellcheck="false" aria-label="Project file name">
      </label>
      <button id="directory-browser-cancel" class="button-secondary" type="button">Cancel</button>
      <button id="directory-browser-select" class="button-primary" type="button" disabled>Open image</button>
    </div>
  </dialog>
  <script src="/static/media-browser.js"></script>
  <script src="/static/media-browser-standalone.js"></script>
</body>
</html>
